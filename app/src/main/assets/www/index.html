<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PDF Studio</title><script src="vendor/pdf-lib.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f6f8;color:#171a1f}.app{min-height:100vh}.top{background:#171a1f;color:#fff;padding:18px 18px 16px;position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}.brand .p{width:38px;height:38px;border-radius:12px;background:#ff6835;display:grid;place-items:center;font-size:24px}.top small{color:#aab0b8;display:block;margin-top:5px}.wrap{padding:18px;max-width:900px;margin:auto}.hero{background:linear-gradient(135deg,#fff,#fff5f0);border:1px solid #e8e9ec;border-radius:22px;padding:20px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:26px}.hero p{margin:0;color:#646b75}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e2e4e8;border-radius:18px;padding:16px;min-height:120px;box-shadow:0 5px 16px #00000008;cursor:pointer}.card:first-child{border:2px solid #ff6835}.ico{font-size:26px}.card b{display:block;margin-top:9px}.card span{font-size:12px;color:#747b85}.panel{display:none;background:#fff;border-radius:20px;padding:18px;border:1px solid #e2e4e8;margin-top:16px}.panel.show{display:block}.panel h2{margin:0 0 4px}.panel p{color:#6d737d;font-size:13px;margin:0 0 14px}.drop{border:2px dashed #ccd0d6;border-radius:16px;padding:24px 12px;text-align:center;margin-bottom:12px}.drop input{max-width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d5d8dd;border-radius:11px;background:#fff;font:inherit}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:800;background:#ff6835;color:#fff;width:100%;margin-top:10px}.back{border:0;background:none;color:#ff6835;font-weight:800;padding:0 0 14px}.status{font-size:13px;margin-top:10px;color:#555}.filelist{font-size:12px;color:#5d636c;margin:8px 0}.hidden{display:none}@media(max-width:600px){.tools{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:14px}.hero h1{font-size:23px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="p">P</div><div>PDF Studio</div></div><small>Offline PDF tools • files stay on your phone</small></header><main class="wrap"><section id="home"><div class="hero"><h1>PDF tools, without uploads.</h1><p>Image → PDF is first. Everything processes locally on your Android device.</p></div><div id="tools" class="tools"></div></section><section id="panel" class="panel"><button class="back" onclick="goHome()">← All tools</button><h2 id="title"></h2><p id="desc"></p><div class="drop"><input id="files" type="file"></div><div id="filelist" class="filelist"></div><div id="opts"></div><button id="run" class="btn">Run tool</button><div id="status" class="status"></div></section></main></div><script>const T=[['img2pdf','🖼️','Image → PDF','Turn JPG/PNG/WebP images into a PDF.'],['pdf2img','📸','PDF → Image','Export PDF pages as PNG or JPEG.'],['merge','🔗','Merge PDFs','Combine multiple PDFs in order.'],['extract','✂️','Split / Extract','Extract selected pages into a PDF.'],['rotate','↻','Rotate Pages','Rotate selected PDF pages.'],['organize','☷','Reorder / Delete','Rebuild a PDF using your page order.'],['watermark','💧','Watermark','Add a text watermark to pages.'],['numbers','#️⃣','Page Numbers','Add page numbers to a PDF.'],['metadata','🏷️','Metadata','Edit title, author, subject and keywords.']];let tool=null,selected=[];const $=id=>document.getElementById(id);$('tools').innerHTML=T.map(x=>`<div class="card" onclick="openTool('${x[0]}')"><div class="ico">${x[1]}</div><b>${x[2]}</b><span>${x[3]}</span></div>`).join('');function openTool(id){tool=T.find(x=>x[0]===id);selected=[];$('home').style.display='none';$('panel').classList.add('show');$('title').textContent=tool[2];$('desc').textContent=tool[3];const f=$('files');f.value='';f.multiple=id==='merge'||id==='img2pdf';f.accept=id==='img2pdf'?'image/jpeg,image/png,image/webp':'application/pdf';$('filelist').textContent='';$('status').textContent='';$('opts').innerHTML=options(id);$('run').onclick=runTool;f.onchange=()=>{selected=[...f.files];$('filelist').textContent=selected.map(x=>x.name).join(' • ')};}function goHome(){$('panel').classList.remove('show');$('home').style.display='block'}function options(id){if(id==='img2pdf')return `<div class="row"><div class="field"><label>Page size</label><select id="pageSize"><option value="a4">A4</option><option value="letter">Letter</option><option value="auto">Match image</option></select></div><div class="field"><label>Fit</label><select id="fit"><option value="contain">Contain</option><option value="cover">Cover</option></select></div></div><div class="field"><label>Margin (pt)</label><input id="margin" type="number" value="24" min="0"></div>`;if(id==='pdf2img')return `<div class="field"><label>Pages</label><input id="pages" value="all" placeholder="all or 1,3-5"></div><div class="row"><div class="field"><label>Format</label><select id="fmt"><option value="png">PNG</option><option value="jpeg">JPEG</option></select></div><div class="field"><label>Scale</label><select id="scale"><option>1</option><option selected>1.5</option><option>2</option><option>3</option></select></div></div><div class="field"><label>JPEG quality</label><input id="quality" type="number" value="92" min="10" max="100"></div>`;if(id==='extract'||id==='rotate')return `<div class="field"><label>Pages</label><input id="pages" value="all" placeholder="1,3-5"></div>${id==='rotate'?`<div class="field"><label>Rotation</label><select id="angle"><option>90</option><option>180</option><option>270</option></select></div>`:''}`;if(id==='organize')return `<div class="field"><label>New page order</label><input id="order" placeholder="3,1,2 or 1-4,7"></div>`;if(id==='watermark')return `<div class="field"><label>Watermark text</label><input id="wm" value="CONFIDENTIAL"></div><div class="row"><div class="field"><label>Font size</label><input id="size" type="number" value="42"></div><div class="field"><label>Opacity</label><input id="opacity" type="number" min="0.05" max="1" step="0.05" value="0.25"></div></div>`;if(id==='numbers')return `<div class="row"><div class="field"><label>Start number</label><input id="start" type="number" value="1"></div><div class="field"><label>Font size</label><input id="size" type="number" value="11"></div></div>`;if(id==='metadata')return `<div class="field"><label>Title</label><input id="mtitle"></div><div class="field"><label>Author</label><input id="author"></div><div class="field"><label>Subject</label><input id="subject"></div><div class="field"><label>Keywords (comma separated)</label><input id="keywords"></div>`;return ''}function v(id){return $(id)?.value||''}function msg(s){$('status').textContent=s}function need(n=1){if(selected.length<n)throw Error(n>1?'Choose at least two files.':'Choose a file first.')}async function bytes(f){return new Uint8Array(await f.arrayBuffer())}function pages(spec,total){spec=(spec||'all').trim().toLowerCase();if(!spec||spec==='all')return [...Array(total).keys()];let out=[];for(const raw of spec.split(',')){let s=raw.trim();if(/^\d+$/.test(s))out.push(+s-1);else{let m=s.match(/^(\d+)\s*-\s*(\d+)$/);if(!m)throw Error('Invalid page selection: '+s);let a=+m[1],b=+m[2],d=a<=b?1:-1;for(let x=a;;x+=d){out.push(x-1);if(x===b)break}}}if(out.some(x=>x<0||x>=total))throw Error('Page selection is outside this PDF.');return out}function base(n){return n.replace(/\.pdf$/i,'').replace(/[^a-z0-9_-]+/gi,'-')||'document'}function save(data,name,mime='application/pdf'){let u=data instanceof Uint8Array?data:new Uint8Array(data);if(window.Android&&Android.saveBase64File){let bin='',step=32768;for(let i=0;i<u.length;i+=step)bin+=String.fromCharCode(...u.subarray(i,i+step));Android.saveBase64File(name,mime,btoa(bin));msg('Saved to Downloads/PDF Studio');return}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function runTool(){try{msg('Processing…');if(!window.PDFLib&&tool[0]!=='pdf2img')throw Error('PDF engine not loaded.');const {PDFDocument,StandardFonts,degrees,rgb}=window.PDFLib||{};let out;if(tool[0]==='img2pdf'){need();let doc=await PDFDocument.create();for(const f of selected){let ab=await f.arrayBuffer(),img;if(f.type==='image/png')img=await doc.embedPng(ab);else if(f.type==='image/jpeg')img=await doc.embedJpg(ab);else{let im=await bitmapToJpeg(f);img=await doc.embedJpg(im)}let pw=595.28,ph=841.89;if(v('pageSize')==='letter'){pw=612;ph=792}else if(v('pageSize')==='auto'){pw=img.width;ph=img.height}let m=Math.max(0,+v('margin')||0),aw=pw-2*m,ah=ph-2*m,scale=v('fit')==='cover'?Math.max(aw/img.width,ah/img.height):Math.min(aw/img.width,ah/img.height),w=img.width*scale,h=img.height*scale,p=doc.addPage([pw,ph]);p.drawImage(img,{x:(pw-w)/2,y:(ph-h)/2,width:w,height:h})}save(await doc.save(),'images.pdf');return}if(tool[0]==='pdf2img'){need();if(!(window.Android&&Android.renderPdfToImages))throw Error('PDF → Image requires the Android APK.');let b64=await toB64(selected[0]);Android.renderPdfToImages(b64,v('pages')||'all',v('fmt')||'png',+v('scale')||1.5,+v('quality')||92,base(selected[0].name));msg('Rendering started. Images will be saved to Downloads/PDF Studio.');return}if(tool[0]==='merge'){need(2);let doc=await PDFDocument.create();for(const f of selected){let src=await PDFDocument.load(await bytes(f),{ignoreEncryption:false});let cp=await doc.copyPages(src,src.getPageIndices());cp.forEach(p=>doc.addPage(p))}save(await doc.save(),'merged.pdf');return}need();let src=await PDFDocument.load(await bytes(selected[0]),{ignoreEncryption:false});if(tool[0]==='extract'){let doc=await PDFDocument.create(),idx=pages(v('pages'),src.getPageCount()),cp=await doc.copyPages(src,idx);cp.forEach(p=>doc.addPage(p));out=await doc.save();save(out,base(selected[0].name)+'-extract.pdf');return}if(tool[0]==='rotate'){let idx=pages(v('pages'),src.getPageCount()),a=+v('angle')||90;idx.forEach(i=>{let p=src.getPage(i);p.setRotation(degrees((p.getRotation().angle+a)%360))});save(await src.save(),base(selected[0].name)+'-rotated.pdf');return}if(tool[0]==='organize'){let idx=pages(v('order'),src.getPageCount()),doc=await PDFDocument.create(),cp=await doc.copyPages(src,idx);cp.forEach(p=>doc.addPage(p));save(await doc.save(),base(selected[0].name)+'-organized.pdf');return}if(tool[0]==='watermark'){let font=await src.embedFont(StandardFonts.HelveticaBold),text=v('wm')||'WATERMARK',size=+v('size')||42,opacity=Math.max(.05,Math.min(1,+v('opacity')||.25));src.getPages().forEach(p=>{let {width,height}=p.getSize(),tw=font.widthOfTextAtSize(text,size);p.drawText(text,{x:(width-tw)/2,y:height/2,size,font,color:rgb(1,.25,.08),opacity,rotate:degrees(35)})});save(await src.save(),base(selected[0].name)+'-watermarked.pdf');return}if(tool[0]==='numbers'){let font=await src.embedFont(StandardFonts.Helvetica),n=+v('start')||1,size=+v('size')||11;src.getPages().forEach((p,i)=>{let text=String(n+i),w=font.widthOfTextAtSize(text,size),ps=p.getSize();p.drawText(text,{x:(ps.width-w)/2,y:18,size,font,color:rgb(.15,.15,.15)})});save(await src.save(),base(selected[0].name)+'-numbered.pdf');return}if(tool[0]==='metadata'){if(v('mtitle'))src.setTitle(v('mtitle'));if(v('author'))src.setAuthor(v('author'));if(v('subject'))src.setSubject(v('subject'));if(v('keywords'))src.setKeywords(v('keywords').split(',').map(x=>x.trim()).filter(Boolean));save(await src.save(),base(selected[0].name)+'-metadata.pdf');return}}catch(e){msg('Error: '+(e.message||e))}}async function bitmapToJpeg(f){let bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0);let bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));return bl.arrayBuffer()}async function toB64(f){let u=await bytes(f),bin='',step=32768;for(let i=0;i<u.length;i+=step)bin+=String.fromCharCode(...u.subarray(i,i+step));return btoa(bin)}</script></body></html>
